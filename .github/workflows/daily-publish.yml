name: Daily Content Publish

on:
  schedule:
    - cron: '0 21 * * *' # 매일 한국 시간 오전 6시 (UTC 21:00)
  workflow_dispatch: # 수동 실행용
  repository_dispatch: # 외부 API 트리거용
    types: [publish_post]

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-generativeai google-analytics-data

      - name: Generate Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          python3 scripts/generate_post.py

      - name: Commit and Push
        run: |
          git config --global user.name "Nexthos (AI Bot)"
          git config --global user.email "bot@nexus-ethos.com"
          git status
          git add content/posts/*.md
          git commit -m "Auto-generate data-driven insight: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
